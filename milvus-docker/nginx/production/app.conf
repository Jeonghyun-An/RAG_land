# ============================================================================
# 운영 Gateway(Nginx) 설정
#   서버 반영 경로 : /data/nuclear-rag/nginx/conf.d/app.conf
#   (gateway 컨테이너의 /etc/nginx/conf.d 로 읽기 전용 마운트되는 디렉토리)
#
# 보안대책(붙임2) 3.3·3.4·3.6 이행 사항
#   - 서비스 경로 허용목록(관리·개발·파인튜닝·디버그·API 문서·문서 업로드 경로는 관리자 IP만)
#   - 질의·음성 변환 요청 속도 / 동시 연결 제한, 요청 본문 크기 제한
#   - MinIO 경로: 서명된 URL 조회(GET/HEAD)만 허용, CORS 출처 한정
#   - 홈페이지(WAS) 연계 API는 서버 내부 직접 호출만 허용
#   - 보안 헤더, 서버 버전 비노출, 접속 로그(쿼리스트링 제외)
#
# 적용 전 확인할 곳은 "★" 표시
#   ★1 real_ip.inc       : Apache(도메인)가 gateway 에 접속하는 IP. 같은 폴더의 별도 파일이며, 서버마다 이 파일만 고치면 됨
#   ★2 admin_ips.inc     : 관리자 PC IP. 같은 폴더의 별도 파일이며, 반입 후에도 이 파일만 고치면 됨
#   ★3 map $cors_origin  : 서비스 도메인
#   ★4 admin_gate.map    : FastAPI(ADMIN_GATE_SECRET)와 공유하는 비밀값. 같은 폴더의 별도 파일(권한 600 권장)
#
# ※ real_ip.inc·admin_ips.inc·admin_gate.map 은 이 파일과 같은 폴더에 **반드시 있어야 한다**(내용은 주석뿐이어도 됨).
#   Nginx 는 include 한 파일이 없으면 설정을 읽지 못한다. 세 파일을 app.conf 와 함께 복사할 것.
#   apply_gateway.sh 는 세 파일이 서버에 이미 있으면 덮어쓰지 않는다(app.conf 만 매번 교체).
#
# 이 파일의 구성 전제 (수행기관 시범 서버, 2026-11-10 확인)
#   - Apache(도메인, SSL 종단)는 별도 서버 192.168.12.55 에 있다. 58번에도 Apache 가 설치돼 있으나 기본 페이지만
#     띄우고 도메인은 처리하지 않는다. 홈페이지 WAS(자바)·Jenkins·CUBRID·AI 스택은 이 서버(58번)에 있다.
#   - Apache 가 X-Forwarded-For 를 붙여서 전달 (ProxyAddHeaders On, 기본값)
#   - 홈페이지 WAS 는 ragnet 에 붙어 http://gateway 로 직접 호출한다(X-Forwarded-For 없음).
#
# Apache 위치별 설정 (58번으로 이전, 전산실 반입 때)
#   [Apache 가 다른 서버]  ← 지금
#     · real_ip.inc: 그 서버 IP 하나 (192.168.12.55)
#     · gateway 포트는 내부망에 게시("90:80"). 127.0.0.1 로 묶으면 Apache 서버에서 접속하지 못한다.
#   [Apache 를 gateway 와 같은 서버로 옮길 때]  — 도메인이 잠시 끊기므로 점검 시간에 한다
#     0) 미리 준비 (도메인 전환 전, 서비스 영향 없음)
#        · 58번 Apache 를 55번과 같게 맞춘다: 모듈(apache2ctl -M 비교: ssl·proxy·proxy_http·proxy_wstunnel·headers 등),
#          인증서, 가상호스트, 전역 설정(서버 버전 비노출 등). 기본 사이트는 끈다(a2dissite 000-default).
#          ufw 를 쓰면 80·443 을 연다.
#        · 가상호스트에서 192.168.12.58:90 이 나오는 곳을 모두 http://127.0.0.1:90 으로 바꾼다.
#          localhost 로 쓰면 ::1 로 접속해 실패할 수 있다. X-Forwarded-For 전달(ProxyAddHeaders)은 끄지 않는다.
#        · 전환 전 시험:  curl -k --resolve <도메인>:443:127.0.0.1 https://<도메인>/rag/
#        · ragnet 게이트웨이 IP 확인:  docker network inspect ragnet --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
#     1) 전환 (이어서 한 번에)
#        ① 스택의 gateway 포트를 "127.0.0.1:90:80" 으로 바꿔 재배포 — 이때부터 55번 Apache 는 접속하지 못한다.
#           (Docker 가 게시한 포트는 ufw 를 거치지 않으므로 방화벽이 아니라 이 설정으로 막는다)
#        ② 서버 conf.d/real_ip.inc 에 0)의 ragnet 게이트웨이 IP 를 추가하고  sudo ./apply_gateway.sh
#           포트를 묶기 전에 넣으면 apply_gateway.sh 가 멈춘다(그 상태에서는 다른 컨테이너가 이 IP 로 들어와 위조할 수 있다).
#        ③ 도메인 연결(DNS·방화벽 NAT)을 58번으로 바꾼다.
#     2) 확인
#        · docker logs --tail 50 gateway 첫 칸이 사용자마다 다른 실제 IP 인지 본다. 모두 172.x.0.1 이면 ②가 맞지 않은 것이다
#          (모든 사용자가 속도 제한을 함께 쓰고 관리자도 403).
#        · 맞으면 real_ip.inc 에서 192.168.12.55 줄을 지우고 다시 apply.
#        · 내부망 PC 에서 58:90 접속 불가 / 도메인 정상 / 홈페이지 WAS 연계(convert-and-index)·완료 통보 정상
#        · docker ps --format '{{.Names}} {{.Ports}}' 에 0.0.0.0·[::] 로 열린 포트가 없는지 본다. FastAPI·MinIO 등이
#          열려 있으면 Gateway 를 거치지 않는 길이 남는다.
#     3) 관리자 IP 다시 등록 — 90 포트를 내부망에서 직접 열 수 없으므로 관리자도 도메인으로 접속한다.
#        도메인으로 관리 화면을 연 뒤  sudo ./apply_gateway.sh --denied  로 보이는 IP 를 확인해 -a 로 등록한다.
#        등록하면 안 되는 IP: 172.x·127.x, real_ip.inc 에 적은 IP, 이 서버 IP(192.168.12.58), 사내에서 도메인으로
#        접속할 때 함께 쓰는 주소(시범: 192.168.12.254), 그리고 이들을 포함하는 대역. 사내 PC 전체나 이 서버의
#        컨테이너가 모두 관리자로 판정된다. 관리자 PC 만 구분되는 IP 가 없으면 기관 관리자 PC(공인 IP)만 등록한다.
#        예전 관리자 IP(192.168.12.253 등)는 admin_ips.inc 에서 직접 지운다.
#   알아 둘 점
#     · 같은 서버로 옮기면 그 서버에서 도는 프로그램(Jenkins 작업 등)은 127.0.0.1:90 에 X-Forwarded-For 를 붙여
#       관리자 IP 로 위장할 수 있다. 서버 접속 권한으로 관리한다. (Apache 와 gateway 를 유닉스 소켓으로 연결하면
#       Apache 만 신뢰하도록 좁힐 수 있다 — 필요하면 별도 검토)
#     · ragnet 을 다시 만들면(스택 삭제 후 재생성 등) 게이트웨이 IP 가 바뀔 수 있다. 그 뒤에는 real_ip.inc 를 확인한다.
#       포트가 127.0.0.1 로 묶여 있는데 real_ip.inc 에 게이트웨이 IP 가 없으면 apply_gateway.sh 가 경고한다.
#     · Apache 앞에 X-Forwarded-For 를 붙이는 WAF·L7 장비가 더 있으면 그 IP 도 real_ip.inc 에 넣는다.
#       공유기·NAT 장비는 넣지 않는다.
#     · 홈페이지 WAS 가 ragnet 이 아닌 다른 서버에 있으면 127.0.0.1 로 묶을 수 없다. 내부망 게시를 유지하고
#       DOCKER-USER 규칙으로 90 포트 접속을 Apache·WAS 서버 IP 로만 제한한다.
# ============================================================================

# ---- WebSocket ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 클라이언트 IP ---------------------------------------------------------
# 신뢰하는 출발지(★1 real_ip.inc)에서 온 요청에 한해 X-Forwarded-For 의 실제 클라이언트 IP 를 사용한다.
# (신뢰 대상 밖에서 보낸 X-Forwarded-For 는 무시)
# 외부 사용자는 Apache 를 거쳐 들어오므로 Apache 를 신뢰하지 않으면 외부 사용자 전원이 Apache IP 하나로 보여
# 관리자 IP 판정과 IP 별 속도 제한이 동작하지 않는다. 클라이언트가 X-Forwarded-For 를 위조해도 Apache 가
# 실제 IP 를 맨 뒤에 덧붙이고, real_ip_recursive 가 신뢰하지 않는 맨 뒤 값을 고르므로 위조 값은 쓰이지 않는다.
# Docker 대역(172.16.0.0/12)은 신뢰하지 않는다. 신뢰하면 ragnet 의 다른 컨테이너(홈페이지 WAS 등)가
# "X-Forwarded-For: <관리자 IP>" 를 붙여 관리자로 판정받을 수 있다.
set_real_ip_from 127.0.0.1;                  # gateway 컨테이너 자신
include /etc/nginx/conf.d/real_ip.inc;       # ★1 Apache(도메인)가 접속하는 IP — 서버마다 다름
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- 관리자 IP --------------------------------------------------------------
# 관리·개발·파인튜닝·디버그·API 문서 경로를 호출할 수 있는 IP. 기본값은 모두 차단(0).
# IP 는 같은 폴더의 admin_ips.inc 에 "IP  1;" 형식으로 적고 `nginx -s reload` 한다. (★2)
# 파일이 비어 있으면(주석뿐이면) 모두 차단된다. 파일 자체가 없으면 Nginx 가 설정을 읽지 못한다.
geo $admin_ip {
    default 0;
    include /etc/nginx/conf.d/admin_ips.inc;
}

# ---- 관리자 경로 인증값 -------------------------------------------------------
# 관리자 IP 인 요청에만 FastAPI 와 공유하는 비밀값을 X-Admin-Gate 헤더로 전달한다. (★4)
# admin_gate.map 에는 `1 "비밀값";` 한 줄만 적는다. 비어 있으면(주석뿐이면) 값이 빈 채로 전달되어
# FastAPI 가 관리자 경로를 거부한다.
map $admin_ip $admin_gate_secret {
    default "";
    include /etc/nginx/conf.d/admin_gate.map;
}

# [임시 2026-11-13] 관리자 IP 와 관계없이 인증값을 붙인다 — 아래 "[임시] 모든 사용자에게 연 관리 기능" 전용.
# 되돌릴 때 그 location 들과 함께 주석 처리한다.
map "1" $admin_gate_secret_open {
    default "";
    include /etc/nginx/conf.d/admin_gate.map;
}

# ---- CORS 허용 출처 (MinIO 서명 URL 조회용) ---------------------------------
# 같은 출처에서 조회하면 CORS 가 필요 없다. 아래에 해당하는 출처만 허용한다.
map $http_origin $cors_origin {      # ★3
    default "";
    "~^https?://(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+)(:\d+)?$"  $http_origin;
    # "~^https://서비스도메인$"  $http_origin;
}

# ---- 요청 속도 / 동시 연결 제한 ----------------------------------------------
limit_req_zone  $binary_remote_addr zone=gw_ask:10m rate=2r/s;     # 질의
limit_req_zone  $binary_remote_addr zone=gw_stt:10m rate=10r/m;    # 음성 변환
limit_req_zone  $binary_remote_addr zone=gw_ui:10m  rate=50r/s;    # 화면·조회
limit_conn_zone $binary_remote_addr zone=gw_conn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ---- 접속 로그: 쿼리스트링(서명 URL·토큰) 제외 -------------------------------
log_format gw '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time';

# ---- Upstream (Docker DNS 로 요청 시점에 다시 해석) --------------------------------
# upstream{} 블록은 gateway 가 시작될 때만 IP 를 해석해서, fastapi·nuxt 컨테이너가 재생성되면
# 옛 IP 로 계속 접속해 502 가 난다. 변수로 지정하면 resolver 가 10초마다 다시 해석한다.
# 127.0.0.11 은 사용자 정의 Docker 네트워크(ragnet)의 내장 DNS 이다.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log gw;

    # 업스트림 주소(변수라서 요청 시점에 DNS 로 다시 해석된다)
    set $nuxt_host    nuxt:3000;
    set $fastapi_host fastapi:8000;
    set $minio_host   minio:9000;

    # 관리자 경로에서만 값이 채워진다(아래 관리자 전용 location). 그 외에는 빈 값이라
    # 클라이언트가 보낸 X-Admin-Gate 헤더도 업스트림으로 전달되지 않는다.
    set $admin_gate "";

    # 기본 요청 본문 1MB (문서 등록·음성 변환 경로는 아래에서 별도 지정)
    client_max_body_size   1m;
    client_header_timeout  15s;
    client_body_timeout    30s;

    # 보안 헤더 (HSTS 는 TLS 를 종단하는 Apache 에서 설정)
    # 화면을 다른 출처의 iframe 에 넣는 경우 X-Frame-Options 를 제거하고 CSP frame-ancestors 로 대체
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    # 프록시 공통 (location 에서 proxy_set_header 를 다시 지정하지 않는다)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Admin-Gate      $admin_gate;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ------------------------------------------------------------------ 기본 응답
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /     { return 302 /chat; }
    location = /rag  { return 302 /rag/chat; }

    # 숨김 파일(.git, .env 등)
    location ~ /\. { return 404; }

    # ------------------------------------------------------------------ [임시 2026-11-13] 모든 사용자에게 연 관리 기능
    # 기관 관리자 PC 의 IP 를 등록할 수 없어(우회·외부 차단 망) 원래처럼 모든 사용자가 쓰도록 임시로 연다.
    #   · 파라미터 조정(RAG 설정 패널): GET·POST /llama/admin/rag-config, POST /llama/admin/rag-config/reset
    #     서버 전체 설정이라 한 사용자가 바꾸면 모든 사용자의 답변에 적용된다(입력 범위는 FastAPI 가 검사).
    #   · 청크 보기(문서 단락): GET /llama/debug/milvus/by-doc
    # 화면은 /admin/rag-config 응답이 200 이면 패널·청크 보기를 보여 주므로 이 블록만으로 다시 보인다(화면 재빌드 불필요).
    # 그 밖의 관리 경로(파인튜닝·모델 관리·업로드·일괄 삭제 등)는 계속 관리자 IP 전용이다.
    # 되돌리기: 이 location 두 개와 위의 map "1" $admin_gate_secret_open 을 주석 처리하고 sudo bash apply_gateway.sh
    location ~ ^/(rag/)?llama/admin/rag-config(/reset)?$ {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        limit_req zone=gw_ui burst=20 nodelay;
        set $admin_gate $admin_gate_secret_open;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }
    location ~ ^/(rag/)?llama/debug/milvus/by-doc$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=gw_ui burst=20 nodelay;
        set $admin_gate $admin_gate_secret_open;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # ------------------------------------------------------------------ 관리자 IP 전용
    # 관리(admin)·개발(dev)·파인튜닝(finetune)·디버그(debug)·Milvus 조회·DB 조회·API 문서·
    # 파일 일괄 삭제(files/purge)·테스트/생성 경로. /llama/... 와 /rag/llama/... 모두 해당.
    location ~ ^/(rag/)?llama/(finetune|admin|dev|debug|milvus|db|docs|openapi\.json|generate|test|files/purge)(/|$) {
        if ($admin_ip = 0) { return 403; }
        set $admin_gate $admin_gate_secret;     # 관리자 IP 인 요청에만 FastAPI 인증값 전달
        client_max_body_size 50m;
        proxy_read_timeout   900s;
        proxy_send_timeout   900s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # ------------------------------------------------------------------ 서비스 경로 (/rag/llama/...)
    # 질의: 초당 2회(버스트 10), IP당 동시 10건
    location ~ ^/rag/llama/ask(-stream)?(/|$) {
        limit_req  zone=gw_ask burst=10 nodelay;
        limit_conn gw_conn 10;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # 문서 등록 진행 상황(SSE)
    location ~ ^/rag/llama/job/[^/]+/stream$ {
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 900s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # 문서 업로드: 관리자 IP 전용(화면에서 쓰지 않음, 문서 등록은 홈페이지 WAS 의 /llama/java 연계로 처리).
    # 관리자 전용 location 과 같은 방식이지만 업로드 크기(200MB)·시간 제한이 달라 별도로 둔다.
    location ~ ^/rag/llama/upload(/|$) {
        if ($admin_ip = 0) { return 403; }
        set $admin_gate $admin_gate_secret;     # FastAPI 도 관리자 인증값을 확인(admin_gate.py)
        client_max_body_size 200m;
        proxy_read_timeout   900s;
        proxy_send_timeout   900s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # 음성 변환: 분당 10회(버스트 5), 파일 25MB
    location ~ ^/rag/llama/stt(/|$) {
        limit_req zone=gw_stt burst=5 nodelay;
        client_max_body_size 25m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # 그 외 화면에서 쓰는 조회 경로
    location ~ ^/rag/llama/(jobs?|doc|files?|rag|status|view|download|healthz)(/|$) {
        limit_req zone=gw_ui burst=100 nodelay;
        proxy_read_timeout 300s;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass http://$fastapi_host;
    }

    # 위에 해당하지 않는 /rag/llama/... 는 전달하지 않음 (허용목록 밖)
    location /rag/llama/ { return 404; }

    # 화면에서 쓰는 음성 변환 경로(/rag/stt/...)
    location ^~ /rag/stt/ {
        limit_req zone=gw_stt burst=5 nodelay;
        client_max_body_size 25m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        rewrite ^/rag/stt/(.*)$ /llama/stt/$1 break;
        proxy_pass http://$fastapi_host;
    }

    # ------------------------------------------------------------------ MinIO (서명된 URL 조회 전용)
    location ^~ /rag/minio/ {
        client_max_body_size 1m;

        # 조회(GET/HEAD)와 CORS 사전요청(OPTIONS)만 허용. (limit_except 는 내부 location 으로 동작해
        # 아래 OPTIONS 응답이 실행되지 않으므로 if 로 직접 검사)
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # location 에서 add_header 를 쓰면 server 단계 헤더가 상속되지 않으므로 다시 지정
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "same-origin" always;
        add_header Access-Control-Allow-Origin  $cors_origin always;   # 허용 출처가 아니면 헤더 없음
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Vary Origin always;

        proxy_read_timeout 300s;
        rewrite ^/rag/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_host;
    }

    # ------------------------------------------------------------------ 관리자 화면(Nuxt 페이지): 관리자 IP 만
    # /rag/admin, /rag/admin/training 등 관리자 페이지 주소는 관리자 IP 가 아니면 403.
    # 화면 파일(/rag/_nuxt/...)은 공개이고, 관리자 API(/llama/admin/...)는 위의 관리자 전용 규칙이 따로 막는다.
    # (^~ /rag/ 가 정규식보다 먼저 적용되므로 정규식이 아니라 더 긴 접두사 규칙으로 둔다)
    location = /rag/admin {
        if ($admin_ip = 0) { return 403; }
        limit_req zone=gw_ui burst=100 nodelay;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://$nuxt_host;
    }
    location ^~ /rag/admin/ {
        if ($admin_ip = 0) { return 403; }
        limit_req zone=gw_ui burst=100 nodelay;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://$nuxt_host;
    }

    # ------------------------------------------------------------------ 화면(Nuxt)
    location ^~ /rag/ {
        limit_req zone=gw_ui burst=100 nodelay;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://$nuxt_host;
    }

    # ------------------------------------------------------------------ 홈페이지(WAS) 연계 API (/llama/...)
    # Apache 를 거친 요청에는 X-Forwarded-For 가 붙는다 → Apache 를 거치지 않은
    # 서버 내부 직접 호출(WAS 등)만 허용. 외부 사용자는 /rag/ 경로만 사용한다.
    location ~ ^/llama/java(/|$) {
        if ($http_x_forwarded_for != "") { return 403; }
        proxy_read_timeout 120s;
        proxy_pass http://$fastapi_host;
    }

    location = /llama/healthz {
        proxy_pass http://$fastapi_host;
    }

    # 그 외 /llama/... 직접 호출은 전달하지 않음 (관리자 경로는 위의 관리자 전용 규칙에서 처리)
    location /llama/ { return 404; }
    location = /llama { return 301 /llama/; }     # 기존 설정과 동일

    # ------------------------------------------------------------------ 기타: 화면
    location / {
        limit_req zone=gw_ui burst=100 nodelay;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://$nuxt_host;
    }
}
